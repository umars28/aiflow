name: AI Review

on:
  workflow_call:
    inputs:
      model:
        type: string
        default: claude-sonnet-5
      max_turns:
        type: string
        default: "20"
      aiflow_ref:
        type: string
        default: main
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

concurrency:
  group: ai-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/checkout@v6
        with:
          repository: umars28/aiflow
          ref: ${{ inputs.aiflow_ref }}
          path: .aiflow-home

      - name: Stage subagents and prompt
        id: prep
        run: |
          mkdir -p .claude/agents .aiflow
          cp .aiflow-home/agents/*.md .claude/agents/
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          {
            echo 'text<<AIFLOW_EOF'
            cat .aiflow-home/prompts/review.md
            printf '\n\n## Arguments\n\nThe base branch is available as `origin/%s`.\nWrite your findings to `.aiflow/05-review.md`. Do not post comments yourself; a later step does that.\n' "${{ github.base_ref }}"
            echo 'AIFLOW_EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ steps.prep.outputs.text }}
          claude_args: |
            --model ${{ inputs.model }}
            --max-turns ${{ inputs.max_turns }}
            --allowedTools "Bash(git:*),Read,Grep,Glob,Write"

      - name: Post review
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          doc=.aiflow/05-review.md
          if [ ! -f "$doc" ]; then
            echo "no review document produced"
            exit 0
          fi
          gh pr comment "${{ github.event.pull_request.number }}" --body-file "$doc"

      - name: Gate
        run: |
          chmod +x .aiflow-home/gates/review.sh
          .aiflow-home/gates/review.sh "$GITHUB_WORKSPACE"
