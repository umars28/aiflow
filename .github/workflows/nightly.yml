name: AI Nightly

on:
  workflow_call:
    inputs:
      model:
        type: string
        default: claude-sonnet-5
      max_turns:
        type: string
        default: "12"
      aiflow_ref:
        type: string
        default: main
      skip_if_idle_hours:
        type: string
        default: "24"
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

concurrency:
  group: ai-nightly-${{ github.repository }}
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 50

      - id: check
        run: |
          last=$(git log -1 --format=%ct)
          age_h=$(( ( $(date -u +%s) - last ) / 3600 ))
          if [ "$age_h" -ge "${{ inputs.skip_if_idle_hours }}" ]; then
            echo "main idle for ${age_h}h — skipping"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "main changed ${age_h}h ago — running"
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  review:
    needs: guard
    if: needs.guard.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/checkout@v6
        with:
          repository: umars28/aiflow
          ref: ${{ inputs.aiflow_ref }}
          path: .aiflow-home

      - name: Stage prompts
        id: prep
        run: |
          mkdir -p .claude/agents
          cp .aiflow-home/agents/*.md .claude/agents/
          {
            echo 'text<<AIFLOW_EOF'
            cat .aiflow-home/prompts/review.md
            printf '\n\n## Arguments\n\nNo pull request. Review the last 20 commits on main: `git log -20 --stat`.\nFocus on what has not been reviewed before.\n'
            echo 'AIFLOW_EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ steps.prep.outputs.text }}
          claude_args: |
            --model ${{ inputs.model }}
            --max-turns ${{ inputs.max_turns }}
            --allowedTools "Bash(git log:*),Bash(git diff:*),Read,Grep,Glob,Write"

      - name: Report findings
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          doc=.aiflow/05-review.md
          test -f "$doc" || exit 0
          if grep -qiE 'no findings|nothing found|clean' "$doc"; then
            echo "clean, nothing to report"
            exit 0
          fi
          gh issue create \
            --title "Nightly review $(date -u +%Y-%m-%d)" \
            --body-file "$doc" \
            --label ai-review || true
