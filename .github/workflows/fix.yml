name: AI Fix

on:
  workflow_call:
    inputs:
      issue:
        type: string
        required: true
      model:
        type: string
        default: claude-opus-5
      max_turns:
        type: string
        default: "30"
      aiflow_ref:
        type: string
        default: main
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

concurrency:
  group: ai-fix-${{ github.repository }}-${{ inputs.issue }}
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/checkout@v6
        with:
          repository: umars28/aiflow
          ref: ${{ inputs.aiflow_ref }}
          path: .aiflow-home

      - uses: actions/setup-go@v5
        if: hashFiles('go.mod') != ''
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        if: hashFiles('package.json') != ''
        with:
          node-version-file: package.json

      - uses: actions/setup-python@v5
        if: hashFiles('pyproject.toml') != ''
        with:
          python-version-file: pyproject.toml

      - name: Stage the defect report
        id: prep
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue }}
        run: |
          mkdir -p .aiflow .claude/agents
          cp .aiflow-home/agents/*.md .claude/agents/
          if printf '%s' "$ISSUE" | grep -qE '^[0-9]+$'; then
            gh issue view "$ISSUE" --json title,body \
              --jq '"# " + .title + "\n\n" + .body' > .aiflow/issue.md
            echo "branch=ai/fix-$ISSUE" >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' "$ISSUE" > .aiflow/issue.md
            echo "branch=ai/fix-$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"
          fi
          {
            echo 'text<<AIFLOW_EOF'
            cat .aiflow-home/prompts/fix.md
            printf '\n\n## Arguments\n\nThe defect report is in `.aiflow/issue.md`. Read it first.\n'
            echo 'AIFLOW_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Branch
        run: git switch -c "${{ steps.prep.outputs.branch }}"

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ steps.prep.outputs.text }}
          claude_args: |
            --model ${{ inputs.model }}
            --max-turns ${{ inputs.max_turns }}
            --allowedTools "Bash,Read,Write,Edit,Grep,Glob"

      - name: Gate
        run: |
          chmod +x .aiflow-home/gates/fix.sh
          .aiflow-home/gates/fix.sh "$GITHUB_WORKSPACE"

      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue }}
          BRANCH: ${{ steps.prep.outputs.branch }}
        run: |
          rm -rf .aiflow-home .claude/agents .aiflow/issue.md
          git config user.name "aiflow"
          git config user.email "aiflow@users.noreply.github.com"
          if [ -z "$(git status --porcelain)" ]; then
            echo "nothing to commit"
            exit 1
          fi
          git add -A
          git commit -m "fix: $(head -1 .aiflow/06-fix.md | sed 's/^#* *//' | cut -c1-60)"
          git push origin "HEAD:$BRANCH"
          cp .aiflow/06-fix.md /tmp/pr-body.md
          if printf '%s' "$ISSUE" | grep -qE '^[0-9]+$'; then
            printf '\n\nCloses #%s\n' "$ISSUE" >> /tmp/pr-body.md
          fi
          gh pr create --head "$BRANCH" --base main \
            --title "fix: $(head -1 .aiflow/06-fix.md | sed 's/^#* *//' | cut -c1-60)" \
            --body-file /tmp/pr-body.md
