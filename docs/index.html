<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>aiflow</title>
<style>
  :root {
    --bg: #f2f5f6;
    --surface: #ffffff;
    --fg: #131a21;
    --muted: #5a6b74;
    --rule: #d4dcdf;
    --accent: #0d7377;
    --passed: #116149;
    --passed-bg: #e1f0e9;
    --failed: #b42318;
    --failed-bg: #fbe9e7;
    --running: #0d6a9b;
    --running-bg: #e2eef6;
    --idle: #5a6b74;
    --idle-bg: #e8edee;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, "Cascadia Mono", Menlo, Consolas, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1417; --surface: #141d21; --fg: #e4ecef; --muted: #8ba0a8;
      --rule: #25343a; --accent: #4cbdb4;
      --passed: #5fc79e; --passed-bg: #112b24;
      --failed: #f0806f; --failed-bg: #2d1512;
      --running: #63b3e0; --running-bg: #10242f;
      --idle: #8ba0a8; --idle-bg: #1a2429;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--mono);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  main { max-width: 860px; margin: 0 auto; padding: 40px 20px 80px; }

  header {
    display: flex;
    align-items: baseline;
    gap: 14px;
    flex-wrap: wrap;
    border-bottom: 2px solid var(--fg);
    padding-bottom: 14px;
    margin-bottom: 4px;
  }

  h1 { font-size: 20px; font-weight: 600; margin: 0; letter-spacing: -.02em; }

  .meta { color: var(--muted); font-size: 12px; margin-left: auto; font-variant-numeric: tabular-nums; }

  .summary { display: flex; gap: 8px; flex-wrap: wrap; padding: 18px 0 20px; }

  .count {
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 3px;
    padding: 9px 13px;
    display: flex;
    gap: 9px;
    align-items: baseline;
  }

  .count b { font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .count span { font-size: 11px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }

  ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1px; }

  li {
    background: var(--surface);
    border: 1px solid var(--rule);
    display: grid;
    grid-template-columns: 4px 1fr max-content;
    align-items: center;
    gap: 0 16px;
  }

  li + li { border-top: 0; }
  li:first-child { border-radius: 3px 3px 0 0; }
  li:last-child { border-radius: 0 0 3px 3px; }

  .stripe { align-self: stretch; }
  li[data-state="passed"] .stripe { background: var(--passed); }
  li[data-state="failed"] .stripe { background: var(--failed); }
  li[data-state="running"] .stripe { background: var(--running); }
  li[data-state="idle"] .stripe { background: var(--idle); opacity: .4; }

  .body { padding: 14px 0; min-width: 0; }

  .name {
    font-weight: 600;
    font-size: 14.5px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .name a { color: inherit; text-decoration: none; }
  .name a:hover, .name a:focus-visible { color: var(--accent); text-decoration: underline; }

  .sub { color: var(--muted); font-size: 12px; margin-top: 3px; }

  .right { padding: 14px 16px; display: flex; align-items: center; gap: 12px; }

  .chip {
    font-size: 10.5px;
    letter-spacing: .08em;
    text-transform: uppercase;
    padding: 3px 9px;
    border-radius: 100px;
    font-weight: 600;
    white-space: nowrap;
  }

  li[data-state="passed"] .chip  { background: var(--passed-bg);  color: var(--passed); }
  li[data-state="failed"] .chip  { background: var(--failed-bg);  color: var(--failed); }
  li[data-state="running"] .chip { background: var(--running-bg); color: var(--running); }
  li[data-state="idle"] .chip    { background: var(--idle-bg);    color: var(--idle); }

  .prs {
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .prs b { color: var(--fg); font-weight: 600; }

  @keyframes pulse { 0%, 100% { opacity: 1 } 50% { opacity: .45 } }
  li[data-state="running"] .chip { animation: pulse 1.6s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) { li[data-state="running"] .chip { animation: none; } }

  .stale {
    background: var(--failed-bg);
    color: var(--failed);
    border: 1px solid currentColor;
    border-radius: 3px;
    padding: 11px 14px;
    margin-bottom: 18px;
    font-size: 13px;
    display: none;
  }
  .stale.show { display: block; }
  .meta.stale-text { color: var(--failed); font-weight: 600; }

  footer { margin-top: 26px; color: var(--muted); font-size: 11.5px; }
  footer a { color: var(--accent); }

  .empty { padding: 36px 0; color: var(--muted); }

  @media (max-width: 540px) {
    .right { flex-direction: column; align-items: flex-end; gap: 5px; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>aiflow</h1>
    <div class="meta" id="meta">loading</div>
  </header>

  <div class="stale" id="stale"></div>
  <div class="summary" id="summary"></div>
  <ul id="list"><li class="empty">loading status.json</li></ul>

  <footer>
    Refreshed twice an hour. If that stops, the banner above says so.
    <a href="https://github.com/umars28/aiflow">umars28/aiflow</a>
  </footer>
</main>

<script>
const ORDER = { failed: 0, running: 1, idle: 2, passed: 3 };

function age(iso) {
  if (!iso) return "—";
  const s = Math.max(0, (Date.now() - new Date(iso)) / 1000);
  if (s < 60) return Math.floor(s) + "s ago";
  if (s < 3600) return Math.floor(s / 60) + "m ago";
  if (s < 86400) return Math.floor(s / 3600) + "h ago";
  return Math.floor(s / 86400) + "d ago";
}

function render(data) {
  const repos = [...data.repos].sort(
    (a, b) => (ORDER[a.state] ?? 9) - (ORDER[b.state] ?? 9) || a.repo.localeCompare(b.repo)
  );

  const tally = repos.reduce((acc, r) => ((acc[r.state] = (acc[r.state] || 0) + 1), acc), {});
  const openPrs = repos.reduce((n, r) => n + (r.prs || 0), 0);

  const cards = [
    ["failed", tally.failed], ["running", tally.running],
    ["passed", tally.passed], ["open prs", openPrs],
  ].filter(([, n]) => n);

  document.getElementById("summary").innerHTML = cards.length
    ? cards.map(([k, n]) => `<div class="count"><b>${n}</b><span>${k}</span></div>`).join("")
    : `<div class="count"><b>${repos.length}</b><span>repos</span></div>`;

  document.getElementById("list").innerHTML = repos.map(r => {
    const short = r.repo.split("/")[1] || r.repo;
    const where = [r.stage, r.branch].filter(Boolean).join(" · ") || "no runs yet";
    const link = r.url ? `<a href="${r.url}">${short}</a>` : short;
    const prs = r.prs ? `<span class="prs"><b>${r.prs}</b> PR</span>` : "";
    return `<li data-state="${r.state}">
      <div class="stripe"></div>
      <div class="body">
        <div class="name">${link}</div>
        <div class="sub">${where} · ${age(r.created_at)}</div>
      </div>
      <div class="right">${prs}<span class="chip">${r.state}</span></div>
    </li>`;
  }).join("");

  const ageMin = (Date.now() - new Date(data.generated_at)) / 60000;
  const meta = document.getElementById("meta");
  meta.textContent = "updated " + age(data.generated_at);
  meta.classList.toggle("stale-text", ageMin > 45);

  const stale = document.getElementById("stale");
  stale.classList.toggle("show", ageMin > 45);
  if (ageMin > 45) {
    stale.textContent =
      "These numbers are " + age(data.generated_at).replace(" ago", " old") +
      ". The refresh job has not run, so what you see below may no longer be true.";
  }
}

async function load() {
  try {
    const res = await fetch("status.json?t=" + Date.now());
    if (!res.ok) throw new Error(res.status);
    render(await res.json());
  } catch (err) {
    document.getElementById("list").innerHTML =
      `<li class="empty">could not read status.json (${err.message})</li>`;
    document.getElementById("meta").textContent = "offline";
  }
}

load();
setInterval(load, 60000);
</script>
</body>
</html>
